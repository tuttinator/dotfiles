# remap prefix to `
set -g prefix `
unbind C-b
bind ` send-prefix

# reload config with visual confirmation
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# true colour, plus extended keys so modified keys (e.g. Shift+Enter in
# Claude Code, Ctrl/Alt chords in nvim) reach apps instead of being flattened
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys,ghostty:RGB:extkeys,alacritty:RGB"
set -s extended-keys on

# OSC 52 clipboard (works over ssh/mosh) and image/escape passthrough
set -g set-clipboard on
set -g allow-passthrough on

# Pane navigation: prefix h/j/k/l comes from tmux-pain-control; Ctrl-h/j/k/l
# without prefix moves across tmux panes AND nvim splits (vim-tmux-navigator).
# Clear the shell screen with prefix C-l.

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# mouse, history, focus
set -g mouse on
set -g history-limit 50000
set -g focus-events on

set -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on

# horizontal and vertical splits
unbind |
bind | split-window -h -c "#{pane_current_path}"
bind t split-window -v -c "#{pane_current_path}"

# resize bindings (repeatable without re-pressing prefix)
unbind Right
bind -r Right resize-pane -R 8
unbind Left
bind -r Left resize-pane -L 8
unbind Up
bind -r Up resize-pane -U 4
unbind Down
bind -r Down resize-pane -D 4

set-option -g status-position top

# Popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Fuzzy session switcher: tmux sessions, zoxide dirs, sesh configs
bind T display-popup -E -w 80% -h 70% "sesh connect \"$(sesh list --icons | fzf --ansi --no-sort --border-label ' sesh ' --prompt '⚡ ')\""

# Theme: catppuccin mocha for now; everything else is Tomorrow Night, which the
# catppuccin plugin can't do, so switching means replacing it. The session block turns red
# while the prefix is active (replaces tmux-prefix-highlight).
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}'

# Plugins (modern TPM syntax)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator' # after pain-control so its C-l wins
set -g @plugin 'catppuccin/tmux#v2.3.1'

# continuum: auto-restore on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Prefers Homebrew-managed TPM (macOS); falls back to the XDG-cloned copy (Linux/Pi)
if-shell "test -f /opt/homebrew/opt/tpm/share/tpm/tpm" \
    "run '/opt/homebrew/opt/tpm/share/tpm/tpm'" \
    "run '~/.config/tmux/plugins/tpm/tpm'"
